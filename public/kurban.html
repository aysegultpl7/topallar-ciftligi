  <header>
    <a href="index.html" class="logo">
    <img src="img/logo.jpg" alt="Topallar Çiftliği logosu">
    </a>
    <h1>TOPALLAR ÇİFTLİĞİ</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>

    </nav>
  </header>

<main>
  <section>
    <h2>Kurbanlıklarımız</h2>

        <div class="filtre-bar">
      <label>
        Sırt No veya cins ara
        <input type="search" id="arama" placeholder="Örn: 58 veya Yerli" autocomplete="off">
      </label>

      <label>
        Almak istediğiniz hisse sayısı
        <select id="hisse-adedi">
          <option value="">Hepsi</option>
          <option value="1">1 ve daha fazla</option>
          <option value="2">2 ve daha fazla</option>
          <option value="3">3 ve daha fazla</option>
          <option value="4">4 ve daha fazla</option>
          <option value="5">5 ve daha fazla</option>
          <option value="6">6 ve daha fazla</option>
          <option value="7">7 (tamamı boş)</option>
        </select>
      </label>

      <label>
        Hisse başına kg
        <select id="hisse-kilo">
          <option value="hepsi">Hepsi</option>
          <option value="20-25">20-25 Kg</option>
          <option value="26-30">26-30 Kg</option>
          <option value="31-35">31-35 Kg</option>
        </select>
      </label>

      <label>
        <input type="checkbox" id="satilanlari-gizle">
        Satılanları Gizle
      </label>
    </div>

    <p id="sonuc-yok" role="status" hidden>Aradığınız özelliklerde hayvan bulunamadı. Lütfen bizi arayın, size uygun hayvanı birlikte bulalım.</p>

    <div class="kurbanliklar" id="kartlar"></div>
  </section>
</main>
